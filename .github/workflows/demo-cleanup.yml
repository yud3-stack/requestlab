name: Demo cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEMO_PROJECT_SLUG: ${{ vars.DEMO_PROJECT_SLUG }}
      NODE_ENV: production
      DEMO_CLEANUP_CONFIRM: YES
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm demo:cleanup
