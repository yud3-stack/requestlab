services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-requestlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-requestlab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-requestlab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - requestlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - requestlab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  requestlab-postgres-data:
  requestlab-redis-data:
